<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>yt downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span></div>

    <main class="hero">
        <h1 id="heading"><span class="accent">yt</span> downloader</h1>
        <p class="tagline">Paste a link. Pick a format. Done.</p>

        <form id="urlForm" class="search" novalidate>
            <input type="url" name="videoURL" id="videoURL" placeholder="Paste a YouTube video link…"
                   autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
            <button type="button" id="pasteBtn" class="icon-btn" title="Paste from clipboard" aria-label="Paste from clipboard">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
            </button>
            <button type="submit" id="downloadBtn" class="primary">
                <span class="label">Download</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </form>
        <p id="error" class="error" role="alert"></p>
    </main>

    <script src="script.js"></script>
    <script src="home.js"></script>
</body>
</html>
